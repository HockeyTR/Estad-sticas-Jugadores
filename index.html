<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas de juego</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c3aa8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201a;--mu:#66736b;--ac:#7c3aa8;--ac2:color-mix(in srgb,var(--ac) 14%,var(--card));--bd:#dde3df;--rd:#dc2626;--yl:#eab308;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#19211d;--tx:#eef3f0;--mu:#93a39a;--bd:#2a3530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#19211d;--tx:#eef3f0;--mu:#93a39a;--bd:#2a3530;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:16px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
input,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0;flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.sm{padding:6px 12px}button.x{background:none;color:var(--mu);padding:4px 8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-weight:500}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bar h1{flex:1}
.act{display:flex;justify-content:space-around;text-align:center;font-size:13px;margin:6px 0 12px}.act div{display:flex;flex-direction:column;align-items:center;gap:4px}
.ic{width:58px;height:58px;border-radius:50%;font-size:24px;padding:0}
.seg{display:flex;gap:6px}.seg button{padding:8px 12px}
.av{border-radius:50%;object-fit:cover;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tm{display:flex;justify-content:space-between;align-items:center;background:var(--ac);color:#fff;border-radius:14px;padding:8px 12px;margin-bottom:10px}.tm.run{background:#34495e}
.t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.w{width:48px;height:48px;border-radius:50%;background:#fff;color:#111;font-size:20px;padding:0}
.pitch{position:relative;aspect-ratio:55/48;margin:0 auto 10px;border-radius:14px;border:2px solid var(--bd);overflow:hidden}.pitch.sala{aspect-ratio:1/1}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px dashed #fff8}
.slot:not(.e){border-color:transparent}.slot.e{background:#0002}.lb{color:#fff;font-weight:700;font-size:12px}
.slot.hov,.bench.hov{outline:3px solid var(--yl);background:#eab30833}
.pc{position:relative;width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:10px;touch-action:none;user-select:none;-webkit-user-select:none;border:3px solid #fff8;overflow:visible}
.pc.ph{background-size:cover;background-position:center}.pc.ph b,.pc.ph i{background:#000a;border-radius:8px;padding:0 5px}
.pc b{font-size:14px}.pc i{font-style:normal;opacity:.9}.pc span{max-width:46px;overflow:hidden;white-space:nowrap}.pc.sel{border-color:var(--yl)}
.tg{position:absolute;top:-10px;background:#fff;color:#111;border-radius:6px;padding:0 5px;font-size:10px;font-weight:700}
.bench{display:flex;flex-wrap:wrap;gap:16px 12px;min-height:76px;padding:16px 8px 8px;border:2px dashed var(--bd);border-radius:14px;margin-bottom:10px}
.ghost{position:fixed;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--yl);color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9;box-shadow:0 4px 12px #0006}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{min-height:44px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}.score b{font:700 56px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.clock{font:700 clamp(84px,28vw,150px)/1 'Barlow Condensed','Arial Narrow',sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}.clock.end{color:var(--rd)}
.q{text-align:center;font:600 20px 'Barlow Condensed','Arial Narrow',sans-serif;color:var(--mu)}
#go{width:100%;min-height:110px;font:700 44px 'Barlow Condensed','Arial Narrow',sans-serif;background:#1d7a4d;color:#fff;border-radius:14px;margin:8px 0}#go.run{background:#ff6a1f}
.sus{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;margin-top:6px;color:#fff;font-weight:600}.sus b{font:700 30px 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}.sus.gr{background:#1d7a4d}.sus.ye{background:#946200}.sus.rd{background:#c23030}
.gb{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px}
.bar2{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ac)}
</style></head><body><div id="app"></div>

function img(f,m,cb,t){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),v=document.createElement('canvas');v.width=im.width*k;v.height=im.height*k;v.getContext('2d').drawImage(im,0,0,v.width,v.height);cb(v.toDataURL(t||'image/png',.85))};im.src=r.result};r.readAsDataURL(f)}

function vHome(){return `<h1 style="margin-bottom:10px">Estadísticas de juego</h1>`+hdr()+`<div class="row sp"><span class="mu" id="dbs">${dbTxt()}</span></div><h2>Categorías</h2>`+S.cats.map(c=>`<div class="card row sp" onclick="go('team','${c.id}')"><b>${E(c.name)}</b><span class="mu">${c.players.length} jugadores ›</span></div>`).join('')+`<div class="card row"><input id="nc" placeholder="Nueva categoría"><button onclick="addCat()">Añadir</button></div>`+clubCard()+backupCard()}

function vTeam(){const c=C(),g=c.cfg;
return bar(E(c.name),"go('home')",`<button class="g sm" onclick="delCat()">${cf==='dc'?'¿Seguro?':'🗑'}</button>`)+`<div class="act">${[['👥','Plantilla','squad'],['📅','Historial','hist'],['📊','Stats','stats'],['🏆','Palmarés','pal']].map(([e,l,s])=>`<div onclick="go('${s}')"><button class="ic">${e}</button>${l}</div>`).join('')}</div>
<div class="card"><div class="row" style="margin-bottom:8px"><span style="flex:0 0 100px">Delegado/a</span><input value="${E(c.staff.del)}" placeholder="Nombre" oninput="C().staff.del=this.value;save()"></div><div class="row"><span style="flex:0 0 100px">Entrenador/a</span><input value="${E(c.staff.ent)}" placeholder="Nombre" oninput="C().staff.ent=this.value;save()"></div></div>
<div class="card"><div class="row" style="margin-bottom:8px"><input id="cd" type="number" min="1" value="${g.qm}" onchange="cfg()" style="flex:0 0 76px"><span class="mu">min por ${g.per==2?'parte':'cuarto'}</span><select id="cp" onchange="cfg()" style="${SEL};flex:1"><option value="2" ${g.per==2?'selected':''}>2 tiempos</option><option value="4" ${g.per==4?'selected':''}>4 cuartos</option></select></div>
<div class="mu" style="margin-bottom:8px">Total del partido: ${g.qm*g.per} min</div><select id="cf" onchange="cfg()" style="${SEL};width:100%">${Object.keys(FM).map(k=>`<option value="${k}" ${g.fm===k?'selected':''}>${FM[k].n}</option>`).join('')}</select></div>
<div class="pitch ${FM[g.fm].sp==='sala'?'sala':''}">${pvIn(g.fm)}</div>
<div class="card"><input id="rv" placeholder="Rival" style="width:100%;margin-bottom:8px"><button style="width:100%" onclick="startM()">Crear partido</button>${msg?`<p style="color:var(--rd);margin:8px 0 0">${msg}</p>`:''}</div>`}
function cfg(){const g=C().cfg;g.qm=Math.max(1,+$('cd').value||15);g.per=+$('cp').value;g.fm=$('cf').value;save();render()}
function delCat(){if(!ask('dc'))return;S.cats=S.cats.filter(c=>c.id!==cid);S.matches=S.matches.filter(m=>m.catId!==cid);S.trophies=S.trophies.filter(m=>m.catId!==cid);save();go('home')}

function vSquad(){const c=C();return bar('Plantilla · '+c.players.length,"go('team')",`<button onclick="addP()">Añadir</button>`)+(c.players.map(p=>`<div class="card row sp" onclick="go('player',null,'${p.id}')"><span class="row">${av(p)}<span><b>${E(p.nick||p.name)}</b><br><span class="mu">${E(p.name)}</span></span></span><span class="mu">${E(p.grp||'')} ›</span></div>`).join('')||'<p class="mu">Sin jugadores. Pulsa Añadir.</p>')}
function addP(){const p={id:uid(),name:'Jugador',nick:'',num:'',lic:'',grp:'',note:'',photo:''};C().players.push(p);save();go('player',null,p.id)}
function vPlayer(){const p=P();if(!p)return'';
const f=(l,k,n)=>`<div class="card row sp"><span>${l}</span><input value="${E(p[k])}" ${n?'inputmode="numeric"':''} oninput="pf('${k}',this.value)" style="text-align:right;max-width:60%"></div>`;
return bar('Jugador',"go('squad')",`<button class="g sm" onclick="delP()">${cf==='dp'?'¿Seguro?':'🗑'}</button>`)+`<label style="display:block;text-align:center;margin-bottom:10px">${av(p,96)}<input type="file" accept="image/*" hidden onchange="setPhoto(this.files[0])"><div class="mu">Toca para cambiar la foto</div></label>`+f('Apodo','nick')+f('Nombre','name')+f('Número','num',1)+f('ID / licencia','lic')+`<div class="card row sp"><span>Asignado</span><div class="seg">${['F','M','GK','D'].map(g=>`<button class="${p.grp===g?'':'g'}" onclick="pg('${g}')">${g}</button>`).join('')}</div></div><div class="card"><div class="mu">Nota</div><textarea oninput="pf('note',this.value)" style="width:100%;height:80px;margin-top:6px">${E(p.note)}</textarea></div>`+ptime(p.id)}
function pf(k,v){P()[k]=v;save()}
function pg(g){const p=P();p.grp=p.grp===g?'':g;save();render()}
function setPhoto(f){img(f,96,u=>{P().photo=u;save();render()},'image/jpeg')}
function delP(){if(!ask('dp'))return;C().players=C().players.filter(x=>x.id!==pid);save();go('squad')}

const PL=(per,k)=>per==2?(k+1)+'H':'Q'+(k+1);let op=null;
function ptime(id){let play=0,bench=0,pj=0,h=[0,0],q=[0,0,0,0],hq=0,qq=0;
S.matches.filter(m=>m.catId===cid&&m.pl[id]).forEach(m=>{const p=m.pl[id],per=m.per||2;play+=p.play||0;bench+=p.bench||0;if((p.play||0)+(p.bench||0)>0)pj++;(p.pp||[]).forEach((x,k)=>{if(per==2){h[k]+=x.p;hq=1}else{q[k]+=x.p;qq=1}})});
const t=play+bench;return `<h2>Tiempo de juego</h2><div class="card"><div class="row sp"><b>Total en juego ${fmt(play)}</b><span class="mu">${pj} PJ</span></div><div class="mu">Banquillo ${fmt(bench)} · ${t?Math.round(play/t*100):0}% en juego</div>${hq?`<div style="margin-top:6px">Partes: ${h.map((s,k)=>PL(2,k)+' '+fmt(s)).join(' · ')}</div>`:''}${qq?`<div style="margin-top:6px">Cuartos: ${q.map((s,k)=>PL(4,k)+' '+fmt(s)).join(' · ')}</div>`:''}${t?'':'<div class="mu">Aún sin partidos jugados.</div>'}</div>`}
function mDet(m){const per=m.per||2;return `<div class="mu" style="margin-top:8px">${m.staff?`Delegado/a: ${E(m.staff.del||'—')} · Entrenador/a: ${E(m.staff.ent||'—')}`:''}</div><div class="mu" style="margin-top:8px">Tiempo por parte: ${(m.pts||[]).map((s,k)=>PL(per,k)+' '+fmt(s)).join(' · ')||'—'}</div>`+(m.ev||[]).map(e=>`<div class="mu">${E(e.s)} · ${E(e.k)} · #${E(e.n)} ${E(e.nm)}</div>`).join('')+Object.values(m.pl).map(p=>{const gt=p.gt||{};return `<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px"><b>${E(p.num)} ${E(p.name)}</b> <span class="mu">juego ${fmt(p.play)} · banquillo ${fmt(p.bench)}</span><div class="mu">${(p.pp||[]).map((q,k)=>PL(per,k)+' '+fmt(q.p)).join(' · ')}</div><div class="mu">🥅 ${p.g||0}${p.g?` (Acc ${gt.acc||0} · PC ${gt.pc||0} · Str ${gt.st||0} · SO ${gt.so||0})`:''} · 🟩 ${p.gr||0} · 🟨 ${p.y||0} · 🟥 ${p.r||0}</div></div>`}).join('')}
function vHist(){const ms=S.matches.filter(m=>m.catId===cid).slice().reverse();return bar('Historial',"go('team')",`<button class="g sm" onclick="expCSV('m')">CSV</button>`)+(ms.map(m=>`<div class="card"><div class="row sp" onclick="op=op==='${m.id}'?null:'${m.id}';render()"><span>vs ${E(m.rival||'Rival')}<br><span class="mu">${m.date} · ${fmt(m.secs)}</span></span><b style="font-size:20px">${m.gf||0} : ${m.ga||0}</b><button class="x" onclick="event.stopPropagation();delM('${m.id}')">✕</button></div>${op===m.id?mDet(m):''}</div>`).join('')||'<p class="mu">Aún no hay partidos.</p>')}
function delM(i){S.matches=S.matches.filter(m=>m.id!==i);save();render()}
function vStats(){const ms=S.matches.filter(m=>m.catId===cid),agg={};
ms.forEach(m=>{const per=m.per||2;Object.entries(m.pl).forEach(([i,p])=>{const a=agg[i]=agg[i]||{name:p.name,num:p.num,pj:0,play:0,bench:0,g:0,gr:0,y:0,r:0,gt:{acc:0,pc:0,st:0,so:0},h:[0,0],q:[0,0,0,0],hq:0,qq:0};if(p.play+p.bench>0)a.pj++;['play','bench','g','gr','y','r'].forEach(k=>a[k]+=(p[k]||0));const gt=p.gt||{};let s=0;['acc','pc','st','so'].forEach(k=>{a.gt[k]+=(gt[k]||0);s+=(gt[k]||0)});a.gt.acc+=Math.max(0,(p.g||0)-s);(p.pp||[]).forEach((q,k)=>{if(per==2){a.h[k]+=q.p;a.hq=1}else{a.q[k]+=q.p;a.qq=1}})})});
const w=ms.filter(m=>m.gf>m.ga).length,d=ms.filter(m=>m.gf===m.ga).length;
return bar('Estadísticas',"go('team')",`<button class="g sm" onclick="expCSV('p')">CSV</button>`)+`<div class="card row sp"><span>${ms.length} PJ</span><span>✅ ${w}</span><span>➖ ${d}</span><span>❌ ${ms.length-w-d}</span></div>`+(Object.values(agg).map(a=>{const t=a.play+a.bench,pj=t?Math.round(a.play/t*100):0;
return `<div class="card"><div class="row sp"><b>${E(a.num?a.num+' ':'')}${E(a.name)}</b><span class="mu">${a.pj} PJ</span></div><div class="bar2" style="margin:8px 0"><i style="width:${pj}%"></i></div><div class="row sp mu"><span>Juego ${pj}%</span><span>Banquillo ${t?100-pj:0}%</span></div><div class="mu" style="margin-top:6px">⏱ Total ${fmt(a.play)} en juego · ${fmt(a.bench)} en banquillo</div>${a.hq?`<div class="mu">Partes: ${a.h.map((s,k)=>PL(2,k)+' '+fmt(s)).join(' · ')}</div>`:''}${a.qq?`<div class="mu">Cuartos: ${a.q.map((s,k)=>PL(4,k)+' '+fmt(s)).join(' · ')}</div>`:''}<div class="row sp" style="margin-top:6px"><span>🥅 ${a.g}</span><span>🟩 ${a.gr}</span><span>🟨 ${a.y}</span><span>🟥 ${a.r}</span></div><div class="mu">Acción ${a.gt.acc} · P. córner ${a.gt.pc} · Stroke ${a.gt.st} · Shoot-out ${a.gt.so}</div></div>`}).join('')||'<p class="mu">Juega un partido para ver porcentajes, goles y tarjetas.</p>')}
function vPal(){const ts=S.trophies.filter(t=>t.catId===cid),n=k=>ts.filter(t=>t.type===k).length;
return bar('Palmarés',"go('team')")+`<div class="card row sp" style="font-size:20px">${Object.keys(TY).map(k=>`<span>${TY[k]} ${n(k)}</span>`).join('')}</div><div class="card"><div class="row" style="margin-bottom:8px"><input id="tt" placeholder="Torneo o liga"><input id="ty" value="2026" inputmode="numeric" style="flex:0 0 72px"></div><div class="row"><select id="tk" style="${SEL};flex:1"><option value="oro">🥇 Oro</option><option value="plata">🥈 Plata</option><option value="bronce">🥉 Bronce</option><option value="copa">🏆 Copa / título</option></select><button onclick="addT()">Añadir</button></div></div>`+(ts.slice().reverse().map(t=>`<div class="card row sp"><span>${TY[t.type]} <b>${E(t.title)}</b> <span class="mu">${E(t.year)}</span></span><button class="x" onclick="delT('${t.id}')">✕</button></div>`).join('')||'<p class="mu">Sin trofeos todavía.</p>')}
function addT(){const t=$('tt').value.trim();if(!t)return;S.trophies.push({id:uid(),catId:cid,title:t,year:$('ty').value,type:$('tk').value});save();render()}
function delT(i){S.trophies=S.trophies.filter(t=>t.id!==i);save();render()}

function startM(){const c=C();if(!c.players.length){msg='Añade jugadores en Plantilla.';render();return}
const f=FM[c.cfg.fm],pl={};c.players.forEach(p=>pl[p.id]={name:p.nick||p.name,num:p.num,grp:p.grp,on:false,play:0,bench:0,g:0,gr:0,y:0,r:0,gt:{acc:0,pc:0,st:0,so:0},pp:Array.from({length:c.cfg.per},()=>({p:0,b:0}))});
live={catId:c.id,rival:$('rv').value.trim(),sport:f.sp,per:c.cfg.per,plen:c.cfg.qm*60,rem:c.cfg.qm*60000,pi:0,secs:0,sus:[],ev:[],ym:5,pts:Array(c.cfg.per).fill(0),gf:0,ga:0,running:false,slots:f.s.map(([l,x,y])=>({l,x,y,pid:null})),pl};sel=null;last=Date.now();clearInterval(timer);timer=setInterval(tick,100);go('live')}
function vLive(){const L=live,ps=L.pl,bn=Object.keys(ps).filter(i=>!L.slots.some(s=>s.pid===i)),p=sel&&ps[sel],last=L.pi>=L.per-1,lab=L.per==2?(L.pi+1)+'H':'Q'+(L.pi+1);
const pm={};((S.cats.find(c=>c.id===L.catId)||{players:[]}).players).forEach(x=>pm[x.id]=x.photo);
const pc=(i,tg,k,tm)=>{const f=S.vw==='foto'&&pm[i];return `<div class="pc ${f?'ph':''} ${sel===i?'sel':''}" data-pid="${i}" ${f?`style="background-image:url(${pm[i]})"`:''}><small class="tg">${E(tg)}</small><b>${E(ps[i].num)}</b>${f?'':`<span>${E(ps[i].name)}</span>`}<i ${k}="${i}">${fmt(tm)}</i></div>`};
return `<div class="row sp" style="margin-bottom:8px"><button class="g sm" onclick="exitL()">${cf==='x'?'¿Salir sin guardar?':'✕'}</button><span class="mu">vs ${E(L.rival||'Rival')}</span></div>
<div class="card"><div class="score"><div><b>${L.gf}</b><br><span class="mu">${E(S.club.name)}</span></div><span>-</span><div><b>${L.ga}</b><br><span class="mu">${E(L.rival||'Rival')}</span></div></div><div class="g2" style="margin-top:8px"><button class="g" onclick="ga(-1)">− Rival</button><button class="g" onclick="ga(1)">+ Rival</button></div></div>
<div class="q">${L.per==2?'Parte':'Cuarto'} ${L.pi+1} de ${L.per}</div><div class="clock ${L.rem===0?'end':''}" id="clk" role="timer">${fmtC(L.rem)}</div><div id="sus">${susHTML()}</div>
<button id="go" class="${L.running?'run':''}" onclick="run()">${L.running?'PARAR':(L.rem===0?'FIN DE '+(L.per==2?'PARTE':'CUARTO'):'INICIAR')}</button>
<div class="g2"><button class="g" onclick="adj(-60000)">-1 min</button><button class="g" onclick="adj(60000)">+1 min</button><button class="g" onclick="adj(-10000)">-10 s</button><button class="g" onclick="adj(10000)">+10 s</button></div>
<div class="g2" style="margin:8px 0"><button class="g" onclick="prevP()" ${L.pi?'':'disabled style="opacity:.4"'}>${L.per==2?'Parte':'Cuarto'} anterior</button><button onclick="nextP()">${L.pi>=L.per-1?(cf==='end'?'¿Seguro? Pulsa otra vez':'Terminar partido'):'Siguiente '+(L.per==2?'parte':'cuarto')}</button></div>
<div class="seg" style="margin-bottom:8px"><button class="${S.vw==='foto'?'g':''}" onclick="setVw('nombre')" style="flex:1">Dorsal + nombre</button><button class="${S.vw==='foto'?'':'g'}" onclick="setVw('foto')" style="flex:1">Dorsal + foto</button></div>
<div class="pitch ${L.sport==='sala'?'sala':''}">${svg(L.sport)}${L.slots.map((s,k)=>`<div class="slot ${s.pid?'':'e'}" data-slot="${k}" style="left:${s.x}%;top:${s.y}%">${s.pid?pc(s.pid,s.l,'data-pt',ps[s.pid].play):`<span class="lb">${s.l}</span>`}</div>`).join('')}</div>
<h2>Banquillo</h2><div class="bench" data-bench="1">${bn.map(i=>pc(i,ps[i].grp||'',"data-bt",ps[i].bench)).join('')||'<span class="mu">Todos en el campo</span>'}</div>
${p?`<div class="card"><b>${E(p.num)} ${E(p.name)}</b><div class="mu" id="ppt" style="margin-top:4px">${p.pp.map((q,k)=>PL(L.per,k)+' '+fmt(q.p)).join(' · ')}</div><div class="gb">${[['acc','Acción','#e59ad0'],['pc','P. córner','#7cc4ff'],['st','Stroke','#ffbb77'],['so','Shoot-out','#9dff8f']].map(([t,l,c])=>`<button style="background:${c};color:#12262d" onclick="gl('${sel}','${t}')">🥅 ${l} ${p.gt[t]}</button>`).join('')}</div><div class="gb">${[['gr','🟩 Verde 2 min','#66d08a'],['y','🟨 Amarilla','#fff36b'],['r','🟥 Roja','#ff7d7d']].map(([k,l,c])=>`<button style="background:${c};color:#12262d" onclick="ev('${sel}','${k}')">${l} ${p[k]}</button>`).join('')}</div><label class="row mu" style="margin-top:8px">Minutos de la amarilla (mínimo 5)<input type="number" min="5" value="${L.ym}" onchange="live.ym=Math.max(5,+this.value||5)" style="flex:0 0 70px"></label></div>`:'<p class="mu">Arrastra del banquillo al puesto. Toca un jugador para goles y tarjetas.</p>'}
${L.ev.length?`<h2>Eventos del partido</h2><div class="card">${L.ev.slice().reverse().map(e=>`<div class="mu">${E(e.s)} · ${E(e.k)} · #${E(e.n)} ${E(e.nm)}</div>`).join('')}</div>`:''}
<button class="g" style="width:100%" onclick="endM()">${cf==='end'?'¿Seguro? Pulsa otra vez':'Guardar y terminar partido'}</button>`}
let last=Date.now();const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const fmtC=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')};
function susHTML(){const L=live,w=i=>`<span>#${E(L.pl[i].num)} ${E(L.pl[i].name)}</span>`;
return L.sus.filter(x=>x.ms>0).map(x=>`<div class="sus ${x.k==='gr'?'gr':'ye'}">${w(x.pid)}<b>${fmtC(x.ms)}</b></div>`).join('')+Object.keys(L.pl).filter(i=>L.pl[i].r>0).map(i=>`<div class="sus rd">${w(i)}<b>Expulsado</b></div>`).join('')}
function paint(){const L=live,c=$('clk');if(!c)return;c.textContent=fmtC(L.rem);c.classList.toggle('end',L.rem===0);const g=$('go');if(g){g.className=L.running?'run':'';g.textContent=L.running?'PARAR':(L.rem===0?'FIN DE '+(L.per==2?'PARTE':'CUARTO'):'INICIAR')}
$('sus').innerHTML=susHTML();document.querySelectorAll('[data-pt]').forEach(e=>e.textContent=fmt(L.pl[e.dataset.pt].play));document.querySelectorAll('[data-bt]').forEach(e=>e.textContent=fmt(L.pl[e.dataset.bt].bench));const t=$('ppt');if(t&&sel&&L.pl[sel])t.textContent=L.pl[sel].pp.map((q,k)=>PL(L.per,k)+' '+fmt(q.p)).join(' · ')}
function tick(){const now=Date.now(),dt=now-last;last=now;const L=live;if(!L||!L.running)return;const s=dt/1000;
L.rem-=dt;L.secs+=s;L.pts[L.pi]+=s;for(const i in L.pl){const p=L.pl[i],q=p.pp[L.pi];if(p.on){p.play+=s;q.p+=s}else{p.bench+=s;q.b+=s}}
L.sus.forEach(x=>{if(x.ms>0){x.ms=Math.max(0,x.ms-dt);if(!x.ms)vib(300)}});
if(L.rem<=0){L.rem=0;L.running=false;vib([400,150,400]);render();return}
paint()}
function run(){const L=live;if(L.rem===0)return;cf=null;L.running=!L.running;last=Date.now();if(L.running){try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}}render()}
function adj(ms){live.rem=Math.min(live.plen*1000,Math.max(0,live.rem+ms));render()}
function prevP(){if(live.pi>0){live.pi--;live.rem=live.plen*1000;live.running=false;render()}}
function nextP(){if(live.pi>=live.per-1){endM();return}live.pi++;live.rem=live.plen*1000;live.running=false;render()}
function ga(d){live.ga=Math.max(0,live.ga+d);render()}
function exitL(){if(!ask('x'))return;clearInterval(timer);live=null;go('team')}
function endM(){if(!ask('end'))return;clearInterval(timer);const L=live;S.matches.push({id:uid(),at:Date.now(),catId:L.catId,rival:L.rival,date:new Date().toISOString().slice(0,10),secs:L.secs,staff:Object.assign({},S.cats.find(x=>x.id===L.catId).staff),per:L.per,pts:L.pts,ev:L.ev,gf:L.gf,ga:L.ga,pl:L.pl});live=null;save();go('hist')}
function sync(){const on=new Set(live.slots.map(s=>s.pid));for(const i in live.pl)live.pl[i].on=on.has(i)}
function setVw(v){S.vw=v;save();render()}
const EN={acc:'Acción',pc:'P. córner',st:'Stroke',so:'Shoot-out',gr:'Tarjeta verde',y:'Tarjeta amarilla',r:'Tarjeta roja'};
function lg(i,k){const L=live,p=L.pl[i],el=L.plen*1000-L.rem,pm=L.plen/60;L.ev.push({k:EN[k],n:p.num,nm:p.name,s:(L.per==2?'P':'C')+(L.pi+1)+' '+fmtC(el)+" · min "+(L.pi*pm+Math.min(pm,Math.floor(el/60000)+1))+"'"})}
function gl(i,t){const p=live.pl[i];p.g++;p.gt[t]++;lg(i,t);if(t!=='so')live.gf++;render()}
function ev(i,k){const L=live;L.pl[i][k]++;lg(i,k);if(k==='gr'||k==='y')L.sus.push({pid:i,k,ms:(k==='gr'?2:L.ym)*60000});if(k==='gr'||k==='y'||k==='r'){L.slots.forEach(s=>{if(s.pid===i)s.pid=null});sync()}render()}
function drop(i,t){const L=live,fs=L.slots.findIndex(s=>s.pid===i),sl=t&&t.closest('[data-slot]');
if(sl){if(L.pl[i].r>0||L.sus.some(x=>x.pid===i&&x.ms>0))return;const ts=+sl.dataset.slot;if(ts!==fs){const o=L.slots[ts].pid;L.slots[ts].pid=i;if(fs>=0)L.slots[fs].pid=o}}

function endDrag(e,ok){if(!dg)return;const d=dg;dg=null;if(d.g)d.g.remove();document.querySelectorAll('.hov').forEach(n=>n.classList.remove('hov'));

let DB=null,dbw={},dbt=null,dbs='load',dbTok=0;
const dbTxt=()=>({cloud:'☁️ Sincronizado con la base de datos del club',local:'💾 Datos guardados en este móvil. Haz copias de seguridad',error:'⚠️ No se pudo sincronizar; los datos siguen en este móvil',load:'⏳ Conectando con la base de datos…'}[dbs]);
function paintDb(){const e=$('dbs');if(e)e.textContent=dbTxt()}
function docsOf(){const o={};o['club/main']={...S.club,vw:S.vw||'nombre'};
S.cats.forEach((c,i)=>{o['cats/'+c.id]={id:c.id,ord:i,name:c.name,cfg:c.cfg,staff:c.staff,players:c.players.map(p=>({...p,photo:''}))};c.players.forEach(p=>{if(p.photo)o['photos/'+p.id]={photo:p.photo}})});
S.matches.forEach(m=>o['matches/'+m.id]=m);S.trophies.forEach(t=>o['trophies/'+t.id]=t);return o}
async function dbPush(){if(!DB)return;const d=docsOf();
try{for(const p in d){const j=JSON.stringify(d[p]);if(dbw[p]!==j){await DB.doc(p).set(JSON.parse(j));dbw[p]=j}}
for(const p of Object.keys(dbw)){if(!(p in d)){await DB.doc(p).delete();delete dbw[p]}}dbs='cloud'}catch(e){dbs='error'}paintDb()}
async function dbLoad(){const tk=++dbTok;dbs='load';render();setTimeout(()=>{if(tk===dbTok&&dbs==='load'){dbTok++;dbs='error';render()}},12000);try{const u=window.claude&&window.claude.use?await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]):null;
if(tk!==dbTok)return;if(!u){dbs='local';render();return}DB=u;const g=async n=>(await DB.collection(n).get()).docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id}));
const [cl,cs,ph,ms,ts]=await Promise.all([DB.doc('club/main').get(),g('cats'),g('photos'),g('matches'),g('trophies')]);
if(tk!==dbTok)return;if(cl.exists){try{localStorage.setItem('mibanquillo_bak',localStorage.getItem('mibanquillo')||'')}catch(e){}
const pm={};ph.forEach(x=>pm[x.id]=x.photo);const k=JSON.parse(JSON.stringify(cl.data()));S.vw=k.vw;S.club={name:k.name,logo:k.logo,color:k.color};
S.cats=cs.sort((a,b)=>(a.ord||0)-(b.ord||0)).map(c=>({id:c.id,name:c.name,cfg:c.cfg,staff:c.staff,players:(c.players||[]).map(p=>({...p,photo:pm[p.id]||''}))}));
S.cats.forEach(c=>{c.cfg=c.cfg||{qm:30,per:2,fm:'h442'};if(c.cfg.qm==null)c.cfg.qm=30;if(!FM[c.cfg.fm])c.cfg.fm='h442';c.staff=c.staff||{del:'',ent:''}});S.matches=ms.sort((a,b)=>(a.at||0)-(b.at||0));S.trophies=ts;dbw={};const d=docsOf();for(const p in d)dbw[p]=JSON.stringify(d[p]);
try{localStorage.setItem('mibanquillo',JSON.stringify(S))}catch(e){}}else await dbPush();
dbs='cloud';render()}catch(e){if(tk===dbTok){dbs='error';render()}}}
